[project]
name = "boxbox-academy"
version = "0.1.0"
description = "Mechanik-instruktor głosowy dla F1 25: tryb nauki i tryb wyścigowy"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boxbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
